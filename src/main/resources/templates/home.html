<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LAKBAY</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Trebuchet MS', 'Arial Black', sans-serif; }
        body { background-color: #132845; display: flex; min-height: 100vh; color: white; }
        .sidebar { width: 140px; background-color: #ffffff; display: flex; flex-direction: column; align-items: center; padding: 40px 0; flex-shrink: 0; }
        .logo { color: #193352; font-size: 2.2rem; font-weight: 900; letter-spacing: -1px; margin-bottom: 50px; text-decoration: none; }
        .nav-menu { display: flex; flex-direction: column; gap: 35px; align-items: center; width: 100%; }
        .nav-item { display: flex; justify-content: center; align-items: center; color: #193352; text-decoration: none; }
        .nav-item.active svg { stroke: #2563eb; }
        .nav-item svg { width: 38px; height: 38px; fill: none; stroke: #193352; stroke-width: 2.2; }
        .main-container { flex-grow: 1; padding: 32px 48px; display: flex; flex-direction: column; gap: 32px; overflow-y: auto; }
        .header-row { display: flex; align-items: center; width: 100%; }
        .search-container { width: 100%; max-width: 720px; display: flex; align-items: center; background-color: #ffffff; border-radius: 30px; padding: 10px 20px; }
        .search-icon { width: 20px; height: 20px; stroke: #132845; stroke-width: 2.5; fill: none; margin-right: 12px; }
        .search-bar { border: none; background: transparent; width: 100%; font-size: 1rem; color: #132845; outline: none; font-weight: 500; }
        .clear-icon { width: 18px; height: 18px; stroke: #132845; stroke-width: 2.5; fill: none; cursor: pointer; }
        .spots-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
        .spot-card { position: relative; height: 360px; border-radius: 16px; overflow: hidden; text-decoration: none; transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .spot-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
        .spot-img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
        .spot-overlay { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.25); display: flex; align-items: center; justify-content: center; padding: 16px; }
        .spot-title { font-size: 2.2rem; font-weight: 800; color: #ffffff; text-align: center; text-shadow: 0 2px 8px rgba(0,0,0,0.6); }
    </style>
</head>
<body>
<div class="sidebar">
    <a th:href="@{/home}" class="logo">LKBY</a>
    <nav class="nav-menu">
        <a th:href="@{/home}" class="nav-item active" title="Home">
            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </a>
        <a th:href="@{/filter}" class="nav-item" title="Filter Spots">
            <svg viewBox="0 0 24 24"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
        </a>
        <a th:href="@{/history}" class="nav-item" title="Booking History">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </a>
        <a th:href="@{/notifications}" class="nav-item" title="Notifications">
            <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </a>
        <a th:href="@{/settings}" class="nav-item" title="Settings">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </a>
    </nav>
</div>
<div class="main-container">
    <div class="header-row">
        <div class="search-container">
            <svg viewBox="0 0 24 24" class="search-icon"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" class="search-bar" placeholder="Search" />
            <svg viewBox="0 0 24 24" class="clear-icon"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </div>
    </div>
    <div class="spots-grid">
        <a th:each="spot : ${spots}" th:href="@{'/country/' + ${spot.countryOrLocation}}" class="spot-card">
            <img th:src="${spot.imageUrl}" class="spot-img" th:alt="${spot.countryOrLocation}" />
            <div class="spot-overlay">
                <h2 class="spot-title" th:text="${spot.countryOrLocation}">Country</h2>
            </div>
        </a>
    </div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const searchInput = document.querySelector('.search-bar');
        const clearIcon = document.querySelector('.clear-icon');
        const spotCards = document.querySelectorAll('.spot-card');
        function filterSpots() {
            const query = searchInput.value.toLowerCase().trim();
            spotCards.forEach(card => {
                const title = card.querySelector('.spot-title').textContent.toLowerCase();
                card.style.display = title.includes(query) ? '' : 'none';
            });
        }
        searchInput.addEventListener('input', filterSpots);
        clearIcon.addEventListener('click', () => {
            searchInput.value = '';
            filterSpots();
        });
    });
</script>
</body>
</html>

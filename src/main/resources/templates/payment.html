<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>LAKBAY</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Trebuchet MS', sans-serif; }
    body { background-color: #193352; display: flex; min-height: 100vh; color: white; }

    .sidebar { width: 140px; background-color: #ffffff; display: flex; flex-direction: column; align-items: center; padding: 40px 0; flex-shrink: 0; }
    .logo { color: #193352; font-size: 2.2rem; font-weight: 900; letter-spacing: -1px; margin-bottom: 50px; text-decoration: none; }
    .nav-menu { display: flex; flex-direction: column; gap: 35px; align-items: center; width: 100%; }
    .nav-item { display: flex; justify-content: center; align-items: center; color: #193352; text-decoration: none; }
    .nav-item svg { width: 38px; height: 38px; fill: none; stroke: #193352; stroke-width: 2.2; }
    .nav-item.active svg { stroke: #2563eb; }

    .main-container { flex-grow: 1; padding: 40px 60px; max-width: 800px; display: flex; flex-direction: column; gap: 25px; }
    .page-title { font-size: 2rem; font-weight: 800; }

    .alert-error {
      background-color: #7f1d1d;
      color: #fca5a5;
      padding: 12px 16px;
      border-radius: 8px;
      font-weight: 600;
    }

    .checkout-card {
      background-color: #22426a;
      border-radius: 16px;
      padding: 35px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .info-row { display: flex; flex-direction: column; gap: 4px; border-bottom: 1px solid #374151; padding-bottom: 12px; }
    .info-row label { font-size: 0.85rem; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; }
    .info-row span { font-size: 1.1rem; font-weight: 600; color: #ffffff; }

    .total-amount { font-size: 1.6rem; font-weight: 900; color: #4ade80; }

    .form-group { display: flex; flex-direction: column; gap: 8px; }
    .form-group label { font-size: 0.95rem; font-weight: 700; }

    .input-row { display: flex; gap: 15px; flex-wrap: wrap; }

    select, input[type="text"] {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #374151;
      background-color: #193352;
      color: white;
      font-size: 1rem;
      outline: none;
    }

    select { width: 180px; }
    input[type="text"] { flex-grow: 1; min-width: 220px; }

    .btn-group {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-top: 10px;
    }

    .back-btn {
      background-color: transparent;
      color: #cbd5e1;
      border: 1px solid #475569;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .back-btn:hover {
      background-color: #334155;
      color: white;
      border-color: #64748b;
    }

    .confirm-btn {
      background-color: #2563eb;
      color: white;
      padding: 12px 28px;
      border-radius: 8px;
      border: none;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }
    .confirm-btn:hover { background-color: #1d4ed8; }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(5px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-card {
      background-color: #22426a;
      color: #ffffff;
      padding: 30px;
      border-radius: 16px;
      width: 90%;
      max-width: 440px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid #374151;
      animation: modalFadeIn 0.25s ease-out;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .modal-icon {
      background-color: #2563eb;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .modal-icon svg {
      width: 24px;
      height: 24px;
      stroke: white;
      fill: none;
      stroke-width: 2.2;
    }

    .modal-title {
      font-size: 1.3rem;
      font-weight: 800;
    }

    .modal-summary {
      background-color: #193352;
      padding: 16px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 0.95rem;
      border: 1px solid #2d4f7c;
    }

    .modal-summary-item {
      display: flex;
      justify-content: space-between;
    }

    .modal-summary-item .label {
      color: #9ca3af;
      font-weight: 600;
    }

    .modal-summary-item .val {
      font-weight: 700;
      color: white;
      text-align: right;
    }


    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 5px;
    }


    .cancel-btn {
      background-color: transparent;
      color: #9ca3af;
      border: 1px solid #4b5563;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }
    .cancel-btn:hover { background-color: #374151; color: white; }


    .pay-final-btn {
      background-color: #4ade80;
      color: #064e3b;
      border: none;
      padding: 10px 22px;
      border-radius: 8px;
      font-weight: 800;
      cursor: pointer;
    }
    .pay-final-btn:hover { background-color: #22c55e; }
  </style>
</head>
<body>


<div class="sidebar">
  <a th:href="@{/home}" class="logo">LKBY</a>
  <nav class="nav-menu">
    <a th:href="@{/home}" class="nav-item active" title="Home">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </a>
    <a th:href="@{/filter}" class="nav-item" title="Filter Spots">
      <svg viewBox="0 0 24 24"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
    </a>
    <a th:href="@{/history}" class="nav-item" title="Booking History">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 16 14"/></svg>
    </a>
    <a th:href="@{/notifications}" class="nav-item" title="Notifications">
      <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    </a>
    <a th:href="@{/settings}" class="nav-item" title="Settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </a>
  </nav>
</div>
<div class="main-container">
  <h1 class="page-title">Booking Checkout</h1>

  <div th:if="${error}" class="alert-error" th:text="${error}">Error Message</div>

  <div class="checkout-card">
    <div class="info-row">
      <label>Destination</label>
      <span th:text="${destination}">Destination Name</span>
    </div>

    <div class="info-row">
      <label>Date & Time</label>
      <span th:text="${flightDate} + ' at ' + ${flightTime}">2026-07-30 at 08:00 AM</span>
    </div>

    <div class="info-row">
      <label>Seats</label>
      <span th:text="${seats}">1</span>
    </div>

    <div class="info-row" style="border-bottom: none;">
      <label>Total Price</label>
      <div class="total-amount" th:text="${formattedTotalPrice}">₱18,500.00</div>
    </div>

    <form id="checkoutForm" th:action="@{/pay}" method="post" style="display: flex; flex-direction: column; gap: 15px; margin-top: 10px;">
      <input type="hidden" name="destination" th:value="${destination}" />
      <input type="hidden" name="flightDate" th:value="${flightDate}" />
      <input type="hidden" name="flightTime" th:value="${flightTime}" />
      <input type="hidden" name="seats" th:value="${seats}" />
      <input type="hidden" name="totalPrice" th:value="${totalPrice}" />

      <div class="form-group">
        <label for="mop">Payment Details</label>
        <div class="input-row">
          <select id="mop" name="mop" required>
            <option value="GCASH" th:selected="${mop == 'GCASH'}">GCash</option>
            <option value="CREDIT_CARD" th:selected="${mop == 'CREDIT_CARD'}">Credit Card</option>
          </select>
          <input type="text" id="accountOrCardNumber" name="accountOrCardNumber" placeholder="GCash (11 digits) or Card (16 digits)" required />
        </div>
      </div>

      <div class="btn-group">
        <button type="button" class="back-btn" onclick="history.back()">Back</button>
        <button type="button" class="confirm-btn" onclick="openConfirmationModal()">Confirm Payment</button>
      </div>
    </form>
  </div>
</div>

<div id="bookingModal" class="modal-overlay">
  <div class="modal-card">
    <div class="modal-header">
      <div class="modal-icon">
        <svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      </div>
      <div class="modal-title">Confirm Booking</div>
    </div>

    <p style="font-size: 0.95rem; color: #cbd5e1;">Please review your payment details before finalizing your booking:</p>

    <div class="modal-summary">
      <div class="modal-summary-item">
        <span class="label">Destination</span>
        <span class="val" th:text="${destination}">Destination</span>
      </div>
      <div class="modal-summary-item">
        <span class="label">Payment Method</span>
        <span class="val" id="summaryMop">GCash</span>
      </div>
      <div class="modal-summary-item">
        <span class="label">Account / Card</span>
        <span class="val" id="summaryAcc">1234</span>
      </div>
      <div class="modal-summary-item" style="border-top: 1px solid #2d4f7c; padding-top: 8px; margin-top: 4px;">
        <span class="label">Total Amount</span>
        <span class="val" style="color: #4ade80; font-size: 1.1rem;" th:text="${formattedTotalPrice}">₱18,500.00</span>
      </div>
    </div>

    <div class="modal-actions">
      <button type="button" class="cancel-btn" onclick="closeConfirmationModal()">Cancel</button>
      <button type="button" class="pay-final-btn" onclick="submitPaymentForm()">Pay & Confirm</button>
    </div>
  </div>
</div>

<script>
  function openConfirmationModal() {
    const form = document.getElementById('checkoutForm');

    if (!form.checkValidity()) {
      form.reportValidity();
      return;
    }

    const mopSelect = document.getElementById('mop');
    const mopText = mopSelect.options[mopSelect.selectedIndex].text;
    const accNumber = document.getElementById('accountOrCardNumber').value;

    document.getElementById('summaryMop').innerText = mopText;
    document.getElementById('summaryAcc').innerText = accNumber;

    document.getElementById('bookingModal').style.display = 'flex';
  }

  function closeConfirmationModal() {
    document.getElementById('bookingModal').style.display = 'none';
  }

  function submitPaymentForm() {
    document.getElementById('checkoutForm').submit();
  }

  window.onclick = function(event) {
    const modal = document.getElementById('bookingModal');
    if (event.target === modal) {
      closeConfirmationModal();
    }
  }
</script>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LAKBAY</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Trebuchet MS', 'Arial Black', sans-serif; }
        body { background-color: #193352; display: flex; min-height: 100vh; color: white; overflow-x: hidden; }
        .sidebar { width: 140px; background-color: #ffffff; display: flex; flex-direction: column; align-items: center; padding: 40px 0; flex-shrink: 0; }
        .logo { color: #193352; font-size: 2.2rem; font-weight: 900; letter-spacing: -1px; margin-bottom: 50px; text-decoration: none; }
        .nav-menu { display: flex; flex-direction: column; gap: 35px; align-items: center; width: 100%; }
        .nav-item { display: flex; justify-content: center; align-items: center; color: #193352; text-decoration: none; }
        .nav-item svg { width: 38px; height: 38px; fill: none; stroke: #193352; stroke-width: 2.2; }
        .nav-item.active svg { stroke: #2563eb; }
        .main-container { flex-grow: 1; padding: 40px 60px; display: flex; flex-direction: column; gap: 25px; }
        .header-section { display: flex; align-items: center; justify-content: space-between; max-width: 900px; }
        .page-title { font-size: 2rem; font-weight: 800; letter-spacing: -0.5px; }
        .back-btn { color: #60a5fa; text-decoration: none; font-weight: 700; font-size: 1.05rem; }
        .back-btn:hover { text-decoration: underline; }
        .results-list { display: flex; flex-direction: column; gap: 20px; max-width: 900px; }
        .spot-card {
            background-color: #22426a;
            border-radius: 16px;
            padding: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        }
        .spot-info h3 { font-size: 1.4rem; color: #ffffff; margin-bottom: 6px; }
        .spot-info p { color: #d1d5db; font-size: 0.95rem; margin-bottom: 4px; }
        .spot-price { text-align: right; }
        .spot-price .price-val { font-size: 1.5rem; font-weight: 900; color: #4ade80; }
        .book-btn {
            display: inline-block;
            margin-top: 8px;
            background-color: #2563eb;
            color: white;
            padding: 8px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
        }
        .empty-card {
            background-color: #22426a;
            border-radius: 16px;
            padding: 50px;
            text-align: center;
            max-width: 900px;
            color: #d1d5db;
            font-size: 1.2rem;
        }
    </style>
</head>

</html>

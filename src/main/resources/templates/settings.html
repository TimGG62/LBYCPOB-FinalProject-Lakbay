<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LAKBAY</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Trebuchet MS', sans-serif; }
        body { background-color: #193352; display: flex; min-height: 100vh; color: white; }
        .sidebar { width: 140px; background-color: #ffffff; display: flex; flex-direction: column; align-items: center; padding: 40px 0; flex-shrink: 0; }
        .logo { color: #193352; font-size: 2.2rem; font-weight: 900; letter-spacing: -1px; margin-bottom: 50px; text-decoration: none; }
        .nav-menu { display: flex; flex-direction: column; gap: 35px; align-items: center; width: 100%; }
        .nav-item { display: flex; justify-content: center; align-items: center; color: #193352; text-decoration: none; }
        .nav-item svg { width: 38px; height: 38px; fill: none; stroke: #193352; stroke-width: 2.2; }
        .nav-item.active svg { stroke: #2563eb; }
        .main-container { flex-grow: 1; padding: 40px 60px; max-width: 800px; }
        .page-title { font-size: 2rem; font-weight: 800; margin-bottom: 25px; }
        .alert-success {
            background-color: #166534;
            color: #4ade80;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .settings-card {
            background-color: #22426a;
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .setting-label {
            font-size: 1.05rem;
            font-weight: 700;
            color: #ffffff;
        }
        .setting-desc {
            font-size: 0.85rem;
            color: #9ca3af;
        }
        select {
            width: 100%;
            max-width: 200px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #374151;
            background-color: #193352;
            color: white;
            font-size: 1rem;
            margin-top: 5px;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            font-size: 1rem;
        }
        .checkbox-label input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #2563eb;
            cursor: pointer;
        }
        .save-btn {
            align-self: flex-start;
            background-color: #2563eb;
            color: white;
            padding: 12px 28px;
            border-radius: 8px;
            border: none;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
        }
        .save-btn:hover { background-color: #1d4ed8; }
        .divider {
            border-bottom: 1px solid #374151;
            margin: 10px 0;
        }
        .logout-btn {
            display: inline-block;
            align-self: flex-start;
            background-color: #ef4444;
            color: white;
            padding: 10px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
        }
        .logout-btn:hover { background-color: #dc2626; }
    </style>
</head>
</html>

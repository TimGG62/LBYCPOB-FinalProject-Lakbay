<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LAKBAY</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Trebuchet MS', sans-serif; }
        body { background-color: #193352; display: flex; min-height: 100vh; color: white; }
        .sidebar { width: 140px; background-color: #ffffff; display: flex; flex-direction: column; align-items: center; padding: 40px 0; flex-shrink: 0; }
        .logo { color: #193352; font-size: 2.2rem; font-weight: 900; letter-spacing: -1px; margin-bottom: 50px; text-decoration: none; }
        .nav-menu { display: flex; flex-direction: column; gap: 35px; align-items: center; width: 100%; }
        .nav-item { display: flex; justify-content: center; align-items: center; color: #193352; text-decoration: none; }
        .nav-item svg { width: 38px; height: 38px; fill: none; stroke: #193352; stroke-width: 2.2; }
        .nav-item.active svg { stroke: #2563eb; }
        .main-container { flex-grow: 1; padding: 40px 60px; max-width: 800px; }
        .page-title { font-size: 2rem; font-weight: 800; margin-bottom: 25px; }
        .alert-success {
            background-color: #166534;
            color: #4ade80;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .settings-card {
            background-color: #22426a;
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .setting-label {
            font-size: 1.05rem;
            font-weight: 700;
            color: #ffffff;
        }
        .setting-desc {
            font-size: 0.85rem;
            color: #9ca3af;
        }
        select {
            width: 100%;
            max-width: 200px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #374151;
            background-color: #193352;
            color: white;
            font-size: 1rem;
            margin-top: 5px;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            font-size: 1rem;
        }
        .checkbox-label input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #2563eb;
            cursor: pointer;
        }
        .save-btn {
            align-self: flex-start;
            background-color: #2563eb;
            color: white;
            padding: 12px 28px;
            border-radius: 8px;
            border: none;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
        }
        .save-btn:hover { background-color: #1d4ed8; }
        .divider {
            border-bottom: 1px solid #374151;
            margin: 10px 0;
        }
        .logout-btn {
            display: inline-block;
            align-self: flex-start;
            background-color: #ef4444;
            color: white;
            padding: 10px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
        }
        .logout-btn:hover { background-color: #dc2626; }
    </style>
</head>
<body>
<div class="sidebar">
    <a th:href="@{/home}" class="logo">LKBY</a>
    <nav class="nav-menu">
        <a th:href="@{/home}" class="nav-item" title="Home">
            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </a>
        <a th:href="@{/filter}" class="nav-item" title="Filter Spots">
            <svg viewBox="0 0 24 24"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
        </a>
        <a th:href="@{/history}" class="nav-item" title="Booking History">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </a>
        <a th:href="@{/notifications}" class="nav-item" title="Notifications">
            <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </a>
        <a th:href="@{/settings}" class="nav-item active" title="Settings">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </a>
    </nav>
</div>
<div class="main-container">
    <h1 class="page-title">User Settings</h1>
    <div th:if="${param.updated}" class="alert-success">
        Settings updated successfully!
    </div>
    <div class="settings-card">
        <form th:action="@{/settings/update}" method="post" class="settings-card" style="padding:0; box-shadow:none;">
            <div class="setting-group">
                <label class="setting-label" for="currency">Preferred Currency</label>
                <span class="setting-desc">Choose the currency for displayed destination prices.</span>
                <select id="currency" name="currency">
                    <option value="PHP" th:selected="${settings.currency == 'PHP'}">PHP (₱)</option>
                    <option value="USD" th:selected="${settings.currency == 'USD'}">USD ($)</option>
                </select>
            </div>
            <div class="divider"></div>
            <div class="setting-group">
                <label class="setting-label">Notification Preferences</label>
                <span class="setting-desc">Filter which types of alerts appear in your notifications feed.</span>
                <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 10px;">
                    <label class="checkbox-label">
                        <input type="checkbox" name="promoAlertsEnabled" value="true" th:checked="${settings.promoAlertsEnabled}" />
                        Promotional & Discount Alerts
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="priceDropAlertsEnabled" value="true" th:checked="${settings.priceDropAlertsEnabled}" />
                        Price Drop Alerts
                    </label>
                </div>
            </div>
            <button type="submit" class="save-btn">Save Changes</button>
        </form>
        <div class="divider"></div>
        <div class="setting-group">
            <label class="setting-label">Account Session</label>
            <span class="setting-desc" style="margin-bottom: 10px;">End your current session safely.</span>
            <a th:href="@{/logout}" class="logout-btn">Log Out</a>
        </div>
    </div>
</div>
</body>
</html>

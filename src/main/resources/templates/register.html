<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LAKBAY</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background-color: #193352;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .logo-header {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #ffffff;
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }
        .logo-icon {
            width: 42px;
            height: 42px;
            border: 3px solid white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background-color: #f8f8f8;
            width: 80%;
            max-width: 850px;
            min-height: 480px;
            border-radius: 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }
        .welcome-title {
            color: #193352;
            font-size: 1.8rem;
            font-weight: 700;
            text-decoration: underline;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }
        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        .form-row {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            width: 100%;
            max-width: 580px;
            margin-bottom: 20px;
        }
        .form-row label {
            color: #193352;
            font-size: 1.8rem;
            font-weight: 700;
            margin-right: 20px;
            white-space: nowrap;
        }

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LAKBAY</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Trebuchet MS', sans-serif; }
        body { background-color: #193352; display: flex; min-height: 100vh; color: white; }
        .sidebar { width: 140px; background-color: #ffffff; display: flex; flex-direction: column; align-items: center; padding: 40px 0; flex-shrink: 0; }
        .logo { color: #193352; font-size: 2.2rem; font-weight: 900; letter-spacing: -1px; margin-bottom: 50px; text-decoration: none; }
        .nav-menu { display: flex; flex-direction: column; gap: 35px; align-items: center; width: 100%; }
        .nav-item { display: flex; justify-content: center; align-items: center; color: #193352; text-decoration: none; }
        .nav-item svg { width: 38px; height: 38px; fill: none; stroke: #193352; stroke-width: 2.2; }
        .nav-item.active svg { stroke: #2563eb; }
        .main-container { flex-grow: 1; padding: 40px 60px; max-width: 850px; display: flex; flex-direction: column; gap: 25px; }
        .page-title { font-size: 2rem; font-weight: 800; }
        .error-alert {
            background-color: #ef4444;
            color: #ffffff;
            padding: 14px 20px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
        }
        .booking-list { display: flex; flex-direction: column; gap: 15px; }
        .booking-card {
            background-color: #22426a;
            border-radius: 12px;
            padding: 24px 28px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }
        .booking-info { display: flex; flex-direction: column; gap: 6px; }
        .booking-title { font-size: 1.2rem; font-weight: 800; color: #ffffff; }
        .booking-meta { font-size: 0.9rem; color: #9ca3af; font-weight: 600; }
        .booking-price { font-size: 1.15rem; font-weight: 800; color: #4ade80; margin-top: 4px; }
        .cancel-btn {
            background-color: #dc2626;
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        .cancel-btn:hover { background-color: #b91c1c; }
        .cancel-btn:active { transform: scale(0.96); }
        .empty-state {
            color: #9ca3af;
            font-size: 1.05rem;
            text-align: center;
            padding: 40px;
            background-color: #22426a;
            border-radius: 12px;
        }
    </style>
</head>
<body>
<div class="sidebar">
    <a th:href="@{/home}" class="logo">LKBY</a>
    <nav class="nav-menu">
        <a th:href="@{/home}" class="nav-item" title="Home">
            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </a>
        <a th:href="@{/filter}" class="nav-item" title="Filter Spots">
            <svg viewBox="0 0 24 24"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
        </a>
        <a th:href="@{/history}" class="nav-item active" title="Booking History">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </a>
        <a th:href="@{/notifications}" class="nav-item" title="Notifications">
            <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </a>
        <a th:href="@{/settings}" class="nav-item" title="Settings">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </a>
    </nav>
</div>
<div class="main-container">
    <h1 class="page-title">Booking History</h1>
    <div class="error-alert" th:if="${error}" th:text="${error}"></div>
    <div class="booking-list" id="bookingList" th:if="${bookings != null and !#lists.isEmpty(bookings)}">
        <div class="booking-card" th:each="booking : ${bookings}">
            <div class="booking-info">
                <h3 class="booking-title" th:text="${booking.destination}">Puerto Princesa Subterranean River & Honda Bay</h3>
                <p class="booking-meta">
                    <span th:text="${booking.flightDate}">2026-08-29</span> at
                    <span th:text="${booking.flightTime}">08:00 AM</span> &bull;
                    <span th:text="${booking.seats}">2</span> Seat(s)
                </p>
                <p class="booking-price">
                    PHP <span th:text="${#numbers.formatDecimal(booking.totalPrice, 1, 'COMMA', 1, 'POINT')}">7000.0</span>
                </p>
            </div>
            <form th:action="@{/history/cancel}" method="post" style="margin: 0;" onsubmit="handleCancel(event, this)">
                <input type="hidden" name="bookingId" th:value="${booking.id}" />
                <button type="submit" class="cancel-btn">Cancel</button>
            </form>
        </div>
    </div>
    <div class="empty-state" id="emptyState" th:if="${bookings == null or #lists.isEmpty(bookings)}">
        No active bookings found.
    </div>
</div>
<script>
    function handleCancel(event, formElement) {
        event.preventDefault();
        if (!confirm("Are you sure you want to cancel this booking?")) {
            return;
        }
        const card = formElement.closest('.booking-card');
        card.style.opacity = '0';
        card.style.transform = 'scale(0.95)';
        setTimeout(() => {
            formElement.submit();
        }, 300);
    }
</script>
</body>
</html>

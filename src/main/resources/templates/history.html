<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LAKBAY</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Trebuchet MS', sans-serif; }
        body { background-color: #193352; display: flex; min-height: 100vh; color: white; }
        .sidebar { width: 140px; background-color: #ffffff; display: flex; flex-direction: column; align-items: center; padding: 40px 0; flex-shrink: 0; }
        .logo { color: #193352; font-size: 2.2rem; font-weight: 900; letter-spacing: -1px; margin-bottom: 50px; text-decoration: none; }
        .nav-menu { display: flex; flex-direction: column; gap: 35px; align-items: center; width: 100%; }
        .nav-item { display: flex; justify-content: center; align-items: center; color: #193352; text-decoration: none; }
        .nav-item svg { width: 38px; height: 38px; fill: none; stroke: #193352; stroke-width: 2.2; }
        .nav-item.active svg { stroke: #2563eb; }
        .main-container { flex-grow: 1; padding: 40px 60px; max-width: 850px; display: flex; flex-direction: column; gap: 25px; }
        .page-title { font-size: 2rem; font-weight: 800; }
        .error-alert {
            background-color: #ef4444;
            color: #ffffff;
            padding: 14px 20px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
        }
        .booking-list { display: flex; flex-direction: column; gap: 15px; }
        .booking-card {
            background-color: #22426a;
            border-radius: 12px;
            padding: 24px 28px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }
        .booking-info { display: flex; flex-direction: column; gap: 6px; }
        .booking-title { font-size: 1.2rem; font-weight: 800; color: #ffffff; }
        .booking-meta { font-size: 0.9rem; color: #9ca3af; font-weight: 600; }
        .booking-price { font-size: 1.15rem; font-weight: 800; color: #4ade80; margin-top: 4px; }
        .cancel-btn {
            background-color: #dc2626;
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        .cancel-btn:hover { background-color: #b91c1c; }
        .cancel-btn:active { transform: scale(0.96); }
        .empty-state {
            color: #9ca3af;
            font-size: 1.05rem;
            text-align: center;
            padding: 40px;
            background-color: #22426a;
            border-radius: 12px;
        }
    </style>
</head>
</html>

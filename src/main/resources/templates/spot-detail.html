<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LAKBAY</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Trebuchet MS', sans-serif; }
        body { background-color: #193352; display: flex; min-height: 100vh; color: white; }

        .sidebar { width: 140px; background-color: #ffffff; display: flex; flex-direction: column; align-items: center; padding: 40px 0; flex-shrink: 0; }
        .logo { color: #193352; font-size: 2.2rem; font-weight: 900; letter-spacing: -1px; margin-bottom: 50px; text-decoration: none; }
        .nav-menu { display: flex; flex-direction: column; gap: 35px; align-items: center; width: 100%; }
        .nav-item { display: flex; justify-content: center; align-items: center; color: #193352; text-decoration: none; }
        .nav-item svg { width: 38px; height: 38px; fill: none; stroke: #193352; stroke-width: 2.2; }
        .nav-item.active svg { stroke: #2563eb; }

        .main-container { flex-grow: 1; padding: 40px 60px; max-width: 850px; display: flex; flex-direction: column; gap: 25px; }
        .header-section { display: flex; align-items: center; justify-content: space-between; }
        .page-title { font-size: 2rem; font-weight: 800; }
        .back-btn { color: #60a5fa; text-decoration: none; font-weight: 700; font-size: 1.05rem; cursor: pointer; }
        .back-btn:hover { color: #93c5fd; text-decoration: underline; }

        .card {
            background-color: #22426a;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .spot-desc { color: #9ca3af; font-size: 1rem; line-height: 1.5; }
        .detail-row { display: flex; gap: 25px; font-size: 0.95rem; color: #d1d5db; }
        .price-tag { font-size: 1.5rem; font-weight: 800; color: #4ade80; margin-top: 5px; }
        .section-heading { font-size: 1.3rem; font-weight: 700; color: #ffffff; border-bottom: 1px solid #374151; padding-bottom: 10px; }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-top: 10px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 0.9rem; font-weight: 700; color: #d1d5db; }

        input, select {
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #374151;
            background-color: #193352;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }

        .submit-btn {
            background-color: #2563eb;
            color: white;
            padding: 12px 28px;
            border-radius: 8px;
            border: none;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            align-self: flex-start;
            margin-top: 10px;
        }
        .submit-btn:hover { background-color: #1d4ed8; }
    </style>
</head>
<body>
<div class="sidebar">
    <a th:href="@{/home}" class="logo">LKBY</a>
    <nav class="nav-menu">
        <a th:href="@{/home}" class="nav-item active" title="Home">
            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </a>
        <a th:href="@{/filter}" class="nav-item" title="Filter Spots">
            <svg viewBox="0 0 24 24"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
        </a>
        <a th:href="@{/history}" class="nav-item" title="Booking History">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 16 14"/></svg>
        </a>
        <a th:href="@{/notifications}" class="nav-item" title="Notifications">
            <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </a>
        <a th:href="@{/settings}" class="nav-item" title="Settings">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </a>
    </nav>
</div>

<div class="main-container">
    <div class="header-section">
        <h1 class="page-title" th:text="${spot.name}">Destination</h1>
        <a href="#" onclick="history.back(); return false;" class="back-btn">&larr; Back</a>
    </div>

    <div class="card">
        <p class="spot-desc" th:text="${spot.description}">Destination details...</p>
        <div class="detail-row">
            <span><strong>Location:</strong> <span th:text="${spot.countryOrLocation}">Japan</span></span>
            <span><strong>Flight Duration:</strong> <span th:text="${spot.flightDuration}">4.0 - 4.5 hrs</span></span>
            <span><strong>Distance:</strong> <span th:text="${spot.distance}">~3,000 km</span></span>
        </div>
        <div class="price-tag">
            Price per Seat: <span th:text="${formattedPrice}">₱18,500.00</span>
        </div>
    </div>

    <div class="card">
        <h2 class="section-heading">Book Flight</h2>
        <form th:action="@{/spot/proceed-to-payment}" method="post" style="display: flex; flex-direction: column; gap: 15px;">
            <input type="hidden" name="destination" th:value="${spot.name}" />
            <input type="hidden" name="pricePerSeat" th:value="${spot.estimatedPrice}" />

            <div class="form-grid">
                <div class="form-group">
                    <label for="flightDate">Flight Date:</label>
                    <input type="date" id="flightDate" name="flightDate" required />
                </div>

                <div class="form-group">
                    <label for="flightTime">Flight Time:</label>
                    <select id="flightTime" name="flightTime" required>
                        <option value="08:00 AM">08:00 AM</option>
                        <option value="01:00 PM">01:00 PM</option>
                        <option value="07:00 PM">07:00 PM</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="seats">Seats:</label>
                    <input type="number" id="seats" name="seats" value="1" min="1" max="10" required />
                </div>
            </div>

            <button type="submit" class="submit-btn">Proceed to Payment</button>
        </form>
    </div>
</div>

</body>
</html>

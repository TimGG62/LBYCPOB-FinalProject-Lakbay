<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LAKBAY</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background-color: #193352;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .logo-header { /* Styles Lakbay logo */
            display: flex;
            align-items: center;
            gap: 12px;
            color: #ffffff;
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }
        .logo-icon { /* Styles circular Lakbay logo */
            width: 42px;
            height: 42px;
            border: 3px solid white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background-color: #f8f8f8;
            width: 80%;
            max-width: 850px;
            min-height: 450px;
            border-radius: 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }
        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        .form-row {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            width: 100%;
            max-width: 480px;
            margin-bottom: 20px;
        }
        .form-row label {
            color: #193352;
            font-size: 1.8rem;
            font-weight: 700;
            margin-right: 20px;
        }
        .form-row input {
            background-color: #555555;
            border: none;
            border-radius: 25px;
            height: 45px;
            width: 260px;
            padding: 0 20px;
            color: white;
            font-size: 1.1rem;
            outline: none;
        }
        .actions {
            display: flex;
            gap: 60px;
            margin-top: 30px;
        }
        .btn-link, .btn-submit {
            background: none;
            border: none;
            color: #193352;
            font-size: 1.4rem;
            font-weight: 700;
            text-decoration: underline;
            cursor: pointer;
            letter-spacing: 1px;
        }
        .error-msg {
            color: #d9534f;
            font-weight: bold;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>


<div class="logo-header">
    <div class="logo-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="white">
            <polygon points="12 2 15 12 12 22 9 12"/>
            <polygon points="22 12 12 15 2 12 12 9"/>
        </svg>
    </div>
    <span>LAKBAY</span>
</div>


<div class="card">
    <div th:if="${error}" class="error-msg" th:text="${error}"></div>


    <form th:action="@{/login}" method="post">
        <div class="form-row">
            <label>Username:</label>
            <input type="text" name="email" required />
        </div>


        <div class="form-row">
            <label>Password:</label>
            <input type="password" name="password" required />
        </div>


        <div class="actions">
            <a th:href="@{/register}" class="btn-link">SIGN UP</a>
            <button type="submit" class="btn-submit">CONFIRM</button>
        </div>
    </form>
</div>


</body>
</html>

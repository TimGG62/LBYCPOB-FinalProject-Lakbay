<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LAKBAY</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Trebuchet MS', 'Arial Black', sans-serif; }
        body { background-color: #193352; display: flex; min-height: 100vh; color: white; overflow-x: hidden; }
        .sidebar { width: 140px; background-color: #ffffff; display: flex; flex-direction: column; align-items: center; padding: 40px 0; flex-shrink: 0; }
        .logo { color: #193352; font-size: 2.2rem; font-weight: 900; letter-spacing: -1px; margin-bottom: 50px; text-decoration: none; }
        .nav-menu { display: flex; flex-direction: column; gap: 35px; align-items: center; width: 100%; }
        .nav-item { display: flex; justify-content: center; align-items: center; color: #193352; text-decoration: none; }
        .nav-item svg { width: 38px; height: 38px; fill: none; stroke: #193352; stroke-width: 2.2; }
        .nav-item.active svg { stroke: #2563eb; }
        .main-container { flex-grow: 1; padding: 40px 60px; display: flex; flex-direction: column; gap: 30px; }
        .page-title { font-size: 2rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 10px; }
        .filter-card {
            background-color: #22426a;
            border-radius: 20px;
            padding: 35px;
            max-width: 800px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            margin-bottom: 30px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .form-group.full-width {
            grid-column: span 2;
        }
        label {
            font-size: 0.95rem;
            font-weight: 700;
            color: #d1d5db;
        }
        input[type="number"], select {
            background-color: #faf9f5;
            border: none;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 1rem;
            color: #193352;
            font-weight: 600;
            outline: none;
        }
        .checkbox-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 5px;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: #193352;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            user-select: none;
        }
        .checkbox-item input {
            width: 18px;
            height: 18px;
            accent-color: #2563eb;
            cursor: pointer;
        }
        .submit-btn {
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            width: 100%;
        }
        .submit-btn:hover {
            background-color: #1d4ed8;
            transform: translateY(-2px);
        }
    </style>
</head>
</html>

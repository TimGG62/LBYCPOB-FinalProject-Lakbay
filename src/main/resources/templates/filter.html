<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LAKBAY</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Trebuchet MS', 'Arial Black', sans-serif; }
        body { background-color: #193352; display: flex; min-height: 100vh; color: white; overflow-x: hidden; }
        .sidebar { width: 140px; background-color: #ffffff; display: flex; flex-direction: column; align-items: center; padding: 40px 0; flex-shrink: 0; }
        .logo { color: #193352; font-size: 2.2rem; font-weight: 900; letter-spacing: -1px; margin-bottom: 50px; text-decoration: none; }
        .nav-menu { display: flex; flex-direction: column; gap: 35px; align-items: center; width: 100%; }
        .nav-item { display: flex; justify-content: center; align-items: center; color: #193352; text-decoration: none; }
        .nav-item svg { width: 38px; height: 38px; fill: none; stroke: #193352; stroke-width: 2.2; }
        .nav-item.active svg { stroke: #2563eb; }
        .main-container { flex-grow: 1; padding: 40px 60px; display: flex; flex-direction: column; gap: 30px; }
        .page-title { font-size: 2rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 10px; }
        .filter-card {
            background-color: #22426a;
            border-radius: 20px;
            padding: 35px;
            max-width: 800px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            margin-bottom: 30px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .form-group.full-width {
            grid-column: span 2;
        }
        label {
            font-size: 0.95rem;
            font-weight: 700;
            color: #d1d5db;
        }
        input[type="number"], select {
            background-color: #faf9f5;
            border: none;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 1rem;
            color: #193352;
            font-weight: 600;
            outline: none;
        }
        .checkbox-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 5px;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: #193352;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            user-select: none;
        }
        .checkbox-item input {
            width: 18px;
            height: 18px;
            accent-color: #2563eb;
            cursor: pointer;
        }
        .submit-btn {
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            width: 100%;
        }
        .submit-btn:hover {
            background-color: #1d4ed8;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
<div class="sidebar">
    <a th:href="@{/home}" class="logo">LKBY</a>
    <nav class="nav-menu">
        <a th:href="@{/home}" class="nav-item" title="Home">
            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </a>
        <a th:href="@{/filter}" class="nav-item active" title="Filter Spots">
            <svg viewBox="0 0 24 24"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
        </a>
        <a th:href="@{/history}" class="nav-item" title="Booking History">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </a>
        <a th:href="@{/notifications}" class="nav-item" title="Notifications">
            <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </a>
        <a th:href="@{/settings}" class="nav-item" title="Settings">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </a>
    </nav>
</div>
<div class="main-container">
    <h1 class="page-title">Find Your Next Destination</h1>
    <div class="filter-card">
        <form th:action="@{/filter/results}" method="post">
            <div class="form-grid">
                <div class="form-group">
                    <label>Scope</label>
                    <select name="scope">
                        <option value="Any">Any Scope</option>
                        <option value="International">International</option>
                        <option value="Domestic">Domestic</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="maxBudget" th:text="'Max Budget (' + ${currency} + ')'">Max Budget (PHP)</label>
                    <input type="number" id="maxBudget" name="maxBudget" value="50000" />
                </div>
                <div class="form-group">
                    <label>Max Duration (Days)</label>
                    <input type="number" name="maxDays" value="7" min="1" />
                </div>
                <div class="form-group">
                    <label>Max Distance (km)</label>
                    <input type="number" name="maxDistance" value="1000" min="0" placeholder="0 for any" />
                </div>

                <div class="form-group">
                    <label>Passengers (Pax)</label>
                    <input type="number" name="pax" value="1" min="1" />
                </div>
                <div class="form-group full-width">
                    <label>Vibes</label>
                    <div class="checkbox-group">
                        <label class="checkbox-item">
                            <input type="checkbox" name="vibes" value="City Explorer" /> City Explorer
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" name="vibes" value="Nature / Beaches" /> Nature / Beaches
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" name="vibes" value="Culture" /> Culture
                        </label>
                    </div>
                </div>
            </div>
            <button type="submit" class="submit-btn">Search Destinations</button>
        </form>
    </div>
</div>
</body>
</html>
